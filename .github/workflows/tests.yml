name: Offline regression tests
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile app.py sports_ui.py portfolio_ui.py position_ledger.py exit_liquidity.py exit_review_ui.py
      - run: python -m unittest discover -v -p 'test_*.py'
